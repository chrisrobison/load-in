<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomous Fixer Ops Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div>
        <p class="eyebrow">Ops Dashboard</p>
        <h1>Autonomous Fixer</h1>
        <p class="intro">Launch autonomous business audits from the left, then inspect jobs, leads, and live agent activity in the workspace on the right.</p>
      </div>

      <section class="control-panel">
        <h2>Launch single audit</h2>
        <form id="single-audit-form" class="stack-form">
          <label>
            Business niche
            <select id="single-vertical" name="vertical">
              <option value="event_venue">Event venue</option>
              <option value="salon">Salon</option>
              <option value="restaurant">Restaurant</option>
            </select>
          </label>
          <label>
            Business name or URL
            <input id="single-query" name="query" placeholder="The Independent or https://business.com" required>
          </label>
          <label>
            Optional city
            <input id="single-city" name="city" placeholder="San Francisco">
          </label>
          <button type="submit">Run venue audit</button>
        </form>
      </section>

      <section class="control-panel">
        <h2>Reconnaissance</h2>
        <form id="city-audit-form" class="stack-form">
          <label>
            Business niche
            <select id="city-vertical" name="vertical">
              <option value="event_venue">Event venue</option>
              <option value="salon">Salon</option>
              <option value="restaurant">Restaurant</option>
            </select>
          </label>
          <label>
            City
            <input id="city-name" name="city" placeholder="Austin" required>
          </label>
          <label>
            Category
            <input id="city-category" name="category" value="music venue" required>
          </label>
          <label>
            Limit
            <input id="city-limit" name="limit" type="number" min="1" max="20" value="5">
          </label>
          <div class="button-row">
            <button type="button" id="preview-recon">Run recon</button>
            <button type="submit">Audit entire city</button>
          </div>
        </form>
      </section>

      <section class="control-panel">
        <h2>Launch state</h2>
        <div id="launch-status" class="muted">No active launch yet.</div>
      </section>
    </aside>

    <main class="main">
      <div class="workspace">
        <div class="tab-bar" id="tab-bar"></div>
        <div class="tab-panels" id="tab-panels"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
